name: Build KeePassDX Custom APK

on:
  push:
    branches:
      - custom-main
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Libre Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (assembleLibreDebug)
        run: ./gradlew assembleLibreDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/libre/debug/ -name "*.apk" -exec cp {} build-output/KeePassDX-Custom-libre-debug.apk \;
          echo "Built APK files:"
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassDX-Custom-APK
          path: build-output/KeePassDX-Custom-libre-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/KeePassDX-Custom-libre-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
